name: Build and verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify installable JAR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Java sources
        run: |
          set -o pipefail
          bash ./gradlew compileJava --no-daemon --stacktrace 2>&1 | tee -a gradle-build.log

      - name: Process resources
        run: |
          set -o pipefail
          bash ./gradlew processResources --no-daemon --stacktrace 2>&1 | tee -a gradle-build.log

      - name: Build distributable JAR
        run: |
          set -o pipefail
          bash ./gradlew build --no-daemon --stacktrace 2>&1 | tee -a gradle-build.log

      - name: Verify installable artifact
        run: python3 scripts/verify_build.py

      - name: Write build report
        if: always()
        shell: bash
        run: |
          {
            echo "# Build report"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Java: $(java -version 2>&1 | head -n 1)"
            echo "- Gradle: $(bash ./gradlew --version | awk '/Gradle / {print; exit}')"
            echo
            echo '```text'
            python3 scripts/verify_build.py
            echo '```'
          } > build-report.md

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bddmod-build-${{ github.run_number }}
          retention-days: 90
          if-no-files-found: error
          path: |
            build/libs/*-all.jar
            build-report.md
            gradle-build.log
